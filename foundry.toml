[profile.default]
src = "solutions"          # exercises/ are in-progress stubs; point tests at either dir explicitly
test = "test"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Local node runs on 9545, not the default 8545 (kept free for other EVM work).
# Start it with:  anvil --port 9545
[rpc_endpoints]
local = "http://127.0.0.1:9545"
